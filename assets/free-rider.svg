      <rect x="546" y="267" width="118" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <text x="568" y="290" fill="#E9ECF1">ELECTRON</text>
