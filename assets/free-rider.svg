      <rect x="70" y="267" width="118" height="36" rx="18" fill="#B8FF5A" fill-opacity="0.1" stroke="#B8FF5A" stroke-opacity="0.38"/>
      <text x="93" y="290" fill="#DFFFBC">OPENAPI</text>
      <rect x="199" y="267" width="94" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <text x="226" y="290" fill="#E9ECF1">GIT</text>
