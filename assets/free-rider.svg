    <text x="68" y="145" fill="#FFFFFF" font-size="64" font-weight="850" letter-spacing="-3">FREE RIDER</text>
    <text x="72" y="187" fill="#D2D6DE" font-size="24" font-weight="600">Ride on your API for Free.</text>
    <text x="72" y="225" fill="#9299A6" font-size="18" font-weight="500">Local-first desktop API client. No server. No account. No paid tier.</text>

