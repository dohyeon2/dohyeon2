  </defs>

  <rect x="1" y="1" width="818" height="358" rx="26" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="2"/>
  <rect x="1" y="1" width="818" height="358" rx="26" fill="url(#dots)"/>
  <rect x="1" y="1" width="818" height="358" rx="26" fill="url(#glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
