<svg width="820" height="360" viewBox="0 0 820 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="820" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090B10"/>
      <stop offset="1" stop-color="#11150E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 176) rotate(180) scale(270 230)">
      <stop stop-color="#B8FF5A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B8FF5A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" fill-opacity="0.035"/>
